<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #error-msg { color: red; font-size: 14px; margin-top: 10px; display: none; text-align: center; }
    </style>
</head>
<body>

<div class="login-box">
    <h2 style="text-align: center; margin-top: 0;">Вход</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Логин</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Войти</button>
        <div id="error-msg"></div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                const data = await response.json();
                // Сохраняем токен и роль в LocalStorage
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                // Перенаправляем на главную
                window.location.href = '/index.html';
            } else {
                errorMsg.textContent = 'Неверный логин или пароль';
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.textContent = 'Ошибка сервера';
            errorMsg.style.display = 'block';
        }
    });
</script>
</body>
</html>
