databaseChangeLog:
  - changeSet:
      id: 001
      author: kalimullin
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
        
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: middle_name
                  type: VARCHAR(60)
                  constraints:
                    nullable: true
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_role
                    references: roles(id)
              - column:
                  name: course
                  type: VARCHAR(1)
                  constraints:
                    nullable: true
              - column:
                  name: record_book_number
                  type: VARCHAR(6)
                  constraints:
                    nullable: true
                    unique: true
              - column:
                  name: education_form
                  type: VARCHAR(20)
                  constraints:
                    nullable: true
              - column:
                  name: education_level
                  type: VARCHAR(20)
                  constraints:
                    nullable: true

        - createTable:
            tableName: groups
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: prefix
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: course
                  type: VARCHAR(1) 
                  constraints:
                    nullable: false
              - column:
                  name: subgroup
                  type: VARCHAR(1)
                  constraints:
                    nullable: false
              - column:
                  name: education_level
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: groups
            columnNames: prefix, course, subgroup
            constraintName: uk_group_fullname

        - createTable:
            tableName: subjects
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: subject_groups
            columns:
              - column:
                  name: subject_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_sg_subject
                    references: subjects(id)
                    deleteCascade: true
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_sg_group
                    references: groups(id)
                    deleteCascade: true 
                           
        - createTable:
            tableName: teacher_subjects
            columns:
              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_ts_teacher
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: subject_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_ts_subject
                    references: subjects(id)
                    deleteCascade: true

        - createTable:
            tableName: student_groups
            columns:
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_sg_student
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_sg_group
                    references: groups(id)
                    deleteCascade: true

        - createTable:
            tableName: teacher_groups
            columns:
              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_tg_teacher
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_tg_group
                    references: groups(id)
                    deleteCascade: true

        - createTable:
            tableName: grades
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_grade_student
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: subject_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_grade_subject
                    references: subjects(id)
                    deleteCascade: true
              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_grade_teacher
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: grade_value
                  type: INT
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: grades
            columnNames: student_id, subject_id, teacher_id
            constraintName: uk_grade_student_subject_teacher

        - addUniqueConstraint:
            tableName: subjects
            columnNames: name
            constraintName: uk_subjects_name

        - sql:
            sql: |
              ALTER TABLE subjects
                ADD CONSTRAINT chk_subjects_name_not_empty
                CHECK (name <> '');

              ALTER TABLE groups
                ADD CONSTRAINT chk_groups_prefix
                CHECK (prefix ~ '^[А-Яа-яЁёA-Za-z]{3,20}$');

              ALTER TABLE users
                ADD CONSTRAINT chk_users_last_name
                CHECK (last_name ~ '^[А-Яа-яЁёA-Za-z-]{1,60}$');

              ALTER TABLE users
                ADD CONSTRAINT chk_users_first_name
                CHECK (first_name ~ '^[А-Яа-яЁёA-Za-z-]{1,60}$');

              ALTER TABLE users
                ADD CONSTRAINT chk_users_middle_name
                CHECK (middle_name IS NULL OR middle_name ~ '^[А-Яа-яЁёA-Za-z-]{1,60}$');

              ALTER TABLE users
                ADD CONSTRAINT chk_users_record_book
                CHECK (record_book_number IS NULL OR record_book_number ~ '^[0-9]{6}$');

              ALTER TABLE grades
                ADD CONSTRAINT chk_grades_value
                CHECK (grade_value BETWEEN 0 AND 5);