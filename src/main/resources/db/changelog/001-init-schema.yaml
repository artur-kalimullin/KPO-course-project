databaseChangeLog:
  - changeSet:
      id: 001
      author: kalimullin
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
        
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_role
                    references: roles(id)

        - createTable:
            tableName: groups
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: subjects
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
        
        - createTable:
            tableName: teacher_subjects
            columns:
              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_ts_teacher
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: subject_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_ts_subject
                    references: subjects(id)
                    deleteCascade: true

        - createTable:
            tableName: student_groups
            columns:
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_sg_student
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_sg_group
                    references: groups(id)
                    deleteCascade: true

        - createTable:
            tableName: teacher_groups
            columns:
              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_tg_teacher
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_tg_group
                    references: groups(id)
                    deleteCascade: true

        - createTable:
            tableName: grades
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_grade_student
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: subject_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_grade_subject
                    references: subjects(id)
                    deleteCascade: true
              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_grade_teacher
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: value
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: grade_date
                  type: DATE
                  constraints:
                    nullable: false