name: Java CI with Maven

on:
  push:
    branches: [ "main", "feature/**", "infra/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: grade_analysis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and run checks with Maven
      env:
        DB_URL: jdbc:postgresql://localhost:5432/grade_analysis
        DB_USERNAME: postgres
        DB_PASSWORD: postgres
      run: ./mvnw clean verify

    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco/

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: grade-analysis-jar
        path: target/*.jar

    - name: Build Docker Image
      run: docker build -t grade-analysis:${{ github.sha }} .

    - name: Build quality metrics summary
      run: |
        python3 <<'PY'
        import csv
        import glob
        import os
        import re
        import xml.etree.ElementTree as ET
        from pathlib import Path

        def format_pct(covered: int, missed: int) -> str:
            total = covered + missed
            if total == 0:
                return "n/a (0/0)"
            return f"{covered / total * 100:.2f}% ({covered}/{total})"

        # --- JaCoCo CSV ---
        jacoco_csv = Path("target/site/jacoco/jacoco.csv")
        instr_missed = instr_covered = 0
        branch_missed = branch_covered = 0

        if jacoco_csv.exists():
            with jacoco_csv.open(newline="", encoding="utf-8") as f:
                for row in csv.DictReader(f):
                    instr_missed += int(row.get("INSTRUCTION_MISSED", 0) or 0)
                    instr_covered += int(row.get("INSTRUCTION_COVERED", 0) or 0)
                    branch_missed += int(row.get("BRANCH_MISSED", 0) or 0)
                    branch_covered += int(row.get("BRANCH_COVERED", 0) or 0)
            instr_text = format_pct(instr_covered, instr_missed)
            branch_text = format_pct(branch_covered, branch_missed)
        else:
            instr_text = "n/a (нет jacoco.csv)"
            branch_text = "n/a (нет jacoco.csv)"

        # --- Surefire XML ---
        tests = failures = errors = skipped = 0
        test_time = 0.0

        xml_reports = glob.glob("target/surefire-reports/TEST-*.xml")
        for xml_path in xml_reports:
            root = ET.parse(xml_path).getroot()
            tests += int(root.attrib.get("tests", 0))
            failures += int(root.attrib.get("failures", 0))
            errors += int(root.attrib.get("errors", 0))
            skipped += int(root.attrib.get("skipped", 0))
            test_time += float(root.attrib.get("time", 0.0))

        # Fallback на .txt, если XML почему-то нет
        if not xml_reports:
            for txt_path in glob.glob("target/surefire-reports/*.txt"):
                text = Path(txt_path).read_text(encoding="utf-8", errors="ignore")
                m = re.search(
                    r"Tests run: (\d+), Failures: (\d+), Errors: (\d+), Skipped: (\d+)",
                    text,
                )
                if m:
                    t, f, e, s = map(int, m.groups())
                    tests += t
                    failures += f
                    errors += e
                    skipped += s
                tm = re.search(r"Time elapsed: ([\d.]+) s", text)
                if tm:
                    test_time += float(tm.group(1))

        passed = tests - failures - errors - skipped
        failed = failures + errors

        md = f"""### Сводка метрик качества

| Метрика | Значение |
|---|---|
| Покрытие кода тестами (instructions) | {instr_text} |
| Покрытие ветвлений | {branch_text} |
| Тестов всего | {tests} |
| Тестов пройдено | {passed} |
| Тестов упало (failures + errors) | {failed} |
| Тестов пропущено | {skipped} |
| Время выполнения тестов | {test_time:.3f} s |

"""
        print(md)

        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary_path:
            with open(summary_path, "a", encoding="utf-8") as f:
                f.write(md)
        PY

    - name: Setup Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v5

    - name: Prepare JaCoCo report for GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        mkdir -p target/site/jacoco
        touch target/site/jacoco/.nojekyll

    - name: Upload Pages artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: target/site/jacoco

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4